# One question of each kind, into a sandbox folder.
# examsoft-questions validate examples/sandbox.yaml
# examsoft-questions create examples/sandbox.yaml --dry-run

defaults:
  folder: 2026 Fall/CS101/Sandbox
  points: 1
  calculator: none

questions:
  - id: mc-single
    type: mc
    title: "EX1 single answer"
    stem: |
      Which search algorithm is complete and optimal when every step costs the same?
    choices:
      - text: Depth-first search
      - text: Breadth-first search
        correct: true
      - text: Greedy best-first search
    randomize_choices: true
    group: search-basics
    rationale: BFS expands nodes in order of depth, which is cost order when steps cost the same.

  - id: mc-multiple
    type: mc
    title: "EX2 multiple answer"
    stem: |
      Which of these numbers are prime?

      Select all that apply.
    choices:
      - text: "2"
        correct: true
      - text: "4"
      - text: "7"
        correct: true
      - text: "9"
      - text: None of the above
        locked: true
    scoring: partial
    randomize_choices: true
    points: 2
    calculator: scientific

  - id: fitb-numeric
    type: fitb
    title: "EX3 fill in the blank"
    stem: |
      The capital of France is {{1}}, and pi to within 0.01 is {{2}}.
    blanks:
      - answers: [Paris, paris]
      - range: [3.13, 3.15]
    partial_credit: true
    points: 2

  - id: essay-short
    type: essay
    title: "EX4 essay"
    stem_html: <p>Explain why <strong>A*</strong> with an admissible heuristic is optimal.</p>
    char_limit: 1500
    points: 4
    calculator: both
    case_study:
      - title: Scenario
        text: |
          A robot plans a route on a grid. Each move costs 1.
      - title: Heuristic
        html: <p>h(n) is the <em>Manhattan distance</em> to the goal.</p>
